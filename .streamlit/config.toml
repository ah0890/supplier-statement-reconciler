[server]
# Upload limit enforced by Streamlit (MB). The application also validates size itself.
maxUploadSize = 25
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
# Users see a friendly message; technical details go to data/logs/reconciler.log.
# Set to "full" while developing.
showErrorDetails = "none"

[theme]
base = "light"
primaryColor = "#1F4E79"
backgroundColor = "#F6F8FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1B2430"
font = "sans serif"
